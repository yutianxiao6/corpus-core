[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-rag-retriever"
version = "0.1.0.dev0"
description = "Configurable offline retrieval core for RAG systems"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = []
dependencies = [
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
qdrant = ["langchain-qdrant>=1.0", "qdrant-client>=1.10"]
embedding = ["langchain-huggingface>=1.0", "sentence-transformers>=5.0"]
documents = [
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.3",
    "lxml>=5.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
]
sparse = ["fastembed>=0.7"]
tables = ["openpyxl>=3.1"]
office = ["python-pptx>=1.0"]
ocr = ["pillow>=10", "pytesseract>=0.3", "pymupdf>=1.24"]
http = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.15",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
rag-index = "offline_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["langchain_text_splitters", "langchain_text_splitters.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["langchain_core", "langchain_core.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["qdrant_client", "qdrant_client.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["bs4", "bs4.*", "docx", "docx.*", "pypdf", "pypdf.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "pptx", "pptx.*", "fitz", "pytesseract", "PIL", "PIL.*"]
follow_imports = "skip"
